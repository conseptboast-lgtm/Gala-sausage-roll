<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080414">
<title>GALAXION ULTRA | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --purple: #a855f7;
  --light-purple: #d8b4fe;
  --silver: #e5e7eb;
  --background: #080414;
}

body {
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 50% 10%, #30105b 0%, transparent 45%),
    radial-gradient(ellipse at 0% 90%, #1b0b36 0%, transparent 40%),
    var(--background);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
  overflow-x: hidden;
}

#stars {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: .65;
  animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.5); }
}

.wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  animation: appear 1s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand {
  text-align: center;
  margin-bottom: 22px;
}

.ship {
  font-size: 66px;
  display: inline-block;
  filter: drop-shadow(0 0 12px #b66aff);
  animation: floatShip 3s ease-in-out infinite;
}

@keyframes floatShip {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-12px) rotate(3deg); }
}

.brand h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(27px, 8vw, 38px);
  font-weight: 800;
  letter-spacing: 5px;
  margin-top: 7px;
  background: linear-gradient(90deg, #fff, #c084fc, #e5e7eb);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 25px rgba(168, 85, 247, .15);
}

.brand p {
  color: #c4b5fd;
  font-size: 11px;
  letter-spacing: 4px;
  margin-top: 8px;
}

.card {
  position: relative;
  overflow: hidden;
  padding: 28px 23px;
  border-radius: 25px;
  border: 1px solid rgba(216, 180, 254, .4);
  background: linear-gradient(
    145deg,
    rgba(45, 20, 75, .78),
    rgba(14, 8, 28, .94)
  );
  box-shadow:
    0 0 25px rgba(168, 85, 247, .16),
    inset 0 0 25px rgba(168, 85, 247, .04);
  backdrop-filter: blur(15px);
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 15%;
  width: 70%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #e9d5ff, transparent);
}

.card h2 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  font-size: 21px;
  letter-spacing: 2px;
  margin-bottom: 9px;
}

.subtitle {
  text-align: center;
  color: #b8a8d7;
  font-size: 12px;
  margin-bottom: 27px;
  line-height: 1.7;
}

.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  color: #e9d5ff;
  font-size: 12px;
  margin-bottom: 9px;
}

.input-wrap {
  position: relative;
}

.input-wrap span {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 17px;
}

input {
  width: 100%;
  padding: 15px 14px 15px 43px;
  background: rgba(5, 2, 15, .72);
  border: 1px solid rgba(196, 181, 253, .28);
  border-radius: 12px;
  color: white;
  outline: none;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  transition: .25s;
}

input:focus {
  border-color: #c084fc;
  box-shadow: 0 0 13px rgba(168, 85, 247, .25);
}

input::placeholder {
  color: #77698d;
}

.password-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #d8b4fe;
  font-size: 11px;
  cursor: pointer;
  padding: 5px;
}

.password-input {
  padding-right: 60px;
}

.forgot {
  display: block;
  text-align: right;
  color: #d8b4fe;
  font-size: 12px;
  text-decoration: none;
  margin-top: -6px;
  margin-bottom: 23px;
}

.forgot:hover {
  color: white;
}

.login-btn {
  position: relative;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  color: white;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  background: linear-gradient(100deg, #7e22ce, #a855f7, #6d28d9);
  box-shadow: 0 0 22px rgba(168, 85, 247, .3);
  transition: .25s;
}

.login-btn:hover {
  box-shadow: 0 0 30px rgba(192, 132, 252, .55);
  transform: translateY(-2px);
}

.login-btn:disabled {
  opacity: .65;
  cursor: wait;
  transform: none;
}

.message {
  display: none;
  margin-top: 17px;
  padding: 12px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.message.error {
  display: block;
  color: #fecaca;
  background: rgba(127, 29, 29, .28);
  border: 1px solid rgba(248, 113, 113, .35);
}

.message.success {
  display: block;
  color: #bbf7d0;
  background: rgba(20, 83, 45, .28);
  border: 1px solid rgba(74, 222, 128, .35);
}

.register-link {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: #b8a8d7;
}

.register-link a {
  color: #e9d5ff;
  text-decoration: none;
  font-weight: 600;
}

.security {
  text-align: center;
  margin-top: 20px;
  color: #897aa3;
  font-size: 10px;
  line-height: 1.8;
}

.footer {
  text-align: center;
  color: #716180;
  font-size: 9px;
  margin-top: 23px;
  letter-spacing: 1px;
}

@media (max-width: 360px) {
  .card {
    padding: 23px 17px;
  }

  .brand h1 {
    letter-spacing: 3px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div id="stars"></div>

<main class="wrapper">

  <header class="brand">
    <div class="ship" aria-hidden="true">🚀</div>
    <h1>GALAXION</h1>
    <p>BEYOND THE ORDINARY</p>
  </header>

  <section class="card">
    <h2>MISSION LOGIN</h2>
    <p class="subtitle">
      Welcome back, space explorer.<br>
      Sign in to continue your journey.
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="phone">PHONE NUMBER</label>
        <div class="input-wrap">
          <span aria-hidden="true">📱</span>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your registered phone"
            autocomplete="username"
            inputmode="tel"
            required
          >
        </div>
      </div>

      <div class="field">
        <label for="password">PASSWORD</label>
        <div class="input-wrap">
          <span aria-hidden="true">🔐</span>
          <input
            type="password"
            id="password"
            name="password"
            class="password-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="password-toggle"
            id="togglePassword"
            aria-label="Show password"
          >SHOW</button>
        </div>
      </div>

      <a href="forgot-password.html" class="forgot">
        Forgot password?
      </a>

      <button type="submit" class="login-btn" id="loginButton">
        ENTER GALAXION ✦
      </button>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <div class="register-link">
      New explorer?
      <a href="register.html">Create an account</a>
    </div>

    <div class="security">
      ✦ YOUR JOURNEY STARTS HERE ✦<br>
      Never share your password with anyone.
    </div>
  </section>

  <footer class="footer">
    GALAXION SPACE NETWORK · ALL RIGHTS RESERVED
  </footer>

</main>

<script>
/* Create background stars */
(function createStars() {
  const container = document.getElementById("stars");

  for (let i = 0; i < 90; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";
    container.appendChild(star);
  }
})();

/* Show or hide password */
document.getElementById("togglePassword").addEventListener("click", function() {
  const password = document.getElementById("password");
  const showing = password.type === "text";

  password.type = showing ? "password" : "text";
  this.textContent = showing ? "SHOW" : "HIDE";
  this.setAttribute("aria-label", showing ? "Show password" : "Hide password");
});

/*
  SUPABASE CONFIGURATION
  Keep the project's existing URL and publishable key here.
*/
const SUPABASE_URL = "https://nkjborwixrcnfkvucjrl.supabase.co";
const SUPABASE_KEY = "sb_publishable_a4Eh2DVMKolGlsmwEAWyGw_qbo45XiM";

let supabaseClient = null;

try {
  if (window.supabase && window.supabase.createClient) {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }
} catch (error) {
  console.error("Supabase setup error:", error);
}

const form = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const messageBox = document.getElementById("message");

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = "message " + type;
}

function normalizePhone(value) {
  return value.trim().replace(/[\s()-]/g, "");
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!supabaseClient) {
    showMessage(
      "Unable to connect to the login service. Check your internet connection and Supabase configuration, then try again.",
      "error"
    );
    return;
  }

  const phone = normalizePhone(document.getElementById("phone").value);
  const password = document.getElementById("password").value;

  if (!phone || !password) {
    showMessage("Please enter your phone number and password.", "error");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "CONNECTING...";
  messageBox.className = "message";
  messageBox.textContent = "";

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      phone: phone,
      password: password
    });

    if (error) {
      throw error;
    }

    if (!data || !data.session) {
      showMessage(
        "Login was not completed. Check your Supabase phone-auth settings.",
        "error"
      );
      return;
    }

    showMessage("Access granted. Preparing your mission...", "success");

    window.setTimeout(function() {
      window.location.href = "profile.html";
    }, 700);

  } catch (error) {
    console.error("Login error:", error);

    let errorText = error && error.message
      ? error.message
      : "Login failed. Please try again.";

    if (/invalid login credentials/i.test(errorText)) {
      errorText = "Incorrect phone number or password. Please check your details and try again.";
    } else if (/phone.*not confirmed/i.test(errorText)) {
      errorText = "Your phone number has not been verified yet. Complete verification before logging in.";
    } else if (/network|fetch/i.test(errorText)) {
      errorText = "Network error. Check your internet connection and try again.";
    }

    showMessage(errorText, "error");

  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "ENTER GALAXION ✦";
  }
});
</script>

</body>
</html>
