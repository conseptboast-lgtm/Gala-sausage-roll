<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gala Sausage Roll</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* --- RESET & BASE STYLES --- */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #FFF9E6; color: #333; overflow-x: hidden; }

    /* --- PAGE TRANSITION UTILITY --- */
    .page { display: none; opacity: 0; transition: opacity 0.5s ease-in-out; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px; }
    .page.active { display: flex; opacity: 1; }

    /* --- SPLASH SCREEN --- */
    #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.6s ease-out, visibility 0.6s ease-out; }
    #splash-screen img { width: 220px; max-width: 80%; height: auto; animation: pulse 1.5s infinite ease-in-out; }
    .loader { margin-top: 30px; width: 40px; height: 4px; background-color: #f1f1f1; border-radius: 4px; position: relative; overflow: hidden; }
    .loader::after { content: ''; position: absolute; left: -50%; width: 50%; height: 100%; background-color: #D50000; border-radius: 4px; animation: loading-bar 1.2s infinite ease-in-out; }
    .splash-hidden { opacity: 0; visibility: hidden; }

    /* --- SHARED TOP LOGO --- */
    .top-logo { width: 120px; margin: 20px auto 30px auto; display: block; }

    /* --- WELCOME PAGE --- */
    .hero-container { width: 100%; max-width: 600px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); margin-bottom: 25px; background-color: #D50000; }
    .hero-image { width: 100%; height: auto; display: block; }
    .welcome-text { text-align: center; max-width: 600px; padding: 0 15px; margin-bottom: 30px; }
    .welcome-text h1 { color: #D50000; font-size: 1.8rem; margin-bottom: 10px; font-weight: 800; text-transform: uppercase; }
    .welcome-text p { font-size: 1.1rem; color: #444; }
    .next-btn { background-color: #D50000; color: #FFD700; border: none; padding: 15px 50px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 15px rgba(213, 0, 0, 0.3); transition: all 0.3s ease; text-transform: uppercase; }
    .next-btn:hover { background-color: #B30000; transform: translateY(-2px); }

    /* --- AUTHENTICATION PAGES --- */
    #registration-page, #login-page { justify-content: flex-start; padding-top: 30px; padding-bottom: 50px; }
    .form-container { background-color: #ffffff; width: 100%; max-width: 400px; padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); border-top: 6px solid #D50000; }
    .form-container h2 { text-align: center; color: #D50000; margin-bottom: 5px; font-size: 1.5rem; }
    .form-container p.subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 25px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #444; }
    .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.3s; background-color: #fafafa; }
    .form-group input:focus { border-color: #D50000; background-color: #fff; }
    .submit-btn { width: 100%; background-color: #D50000; color: #ffffff; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: background-color 0.3s; }
    .submit-btn:hover { background-color: #B30000; }
    .auth-switch { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #666; }
    .auth-switch a { color: #D50000; text-decoration: none; font-weight: bold; cursor: pointer; }

    /* --- ANIMATIONS --- */
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    @keyframes loading-bar { 0% { left: -50%; } 100% { left: 100%; } }
  </style>
</head>
<body>

  <!-- 1. LOADING SCREEN -->
  <div id="splash-screen">
    <img src="logo.png" alt="Gala Sausage Roll Logo">
    <div class="loader"></div>
  </div>

  <!-- 2. WELCOME PAGE -->
  <div id="welcome-page" class="page">
    <img src="logo.png" alt="Gala Logo" class="top-logo">
    <div class="hero-container">
      <img src="hero.jpg" alt="Welcome to Gala" class="hero-image" onerror="this.src='logo.png'">
    </div>
    <div class="welcome-text">
      <h1>Welcome to Gala Sausage Roll</h1>
      <p>A stable place of income</p>
    </div>
    <button class="next-btn" onclick="showPage('registration-page')">Next</button>
  </div>

  <!-- 3. REGISTRATION PAGE -->
  <div id="registration-page" class="page">
    <img src="logo.png" alt="Gala Logo" class="top-logo">
    <div class="form-container">
      <h2>Create an Account</h2>
      <p class="subtitle">Join the Gala family today</p>
      
      <form onsubmit="event.preventDefault(); registerUser();">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="reg-phone" placeholder="08012345678" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Create a strong password" required>
        </div>
        <div class="form-group">
          <label>Referral Code</label>
          <input type="text" id="reg-referral" placeholder="Enter friend's code">
        </div>
        <button type="submit" class="submit-btn">Register</button>
      </form>
      
      <div class="auth-switch">
        Already have an account? <a onclick="showPage('login-page')">Log in</a>
      </div>
    </div>
  </div>

  <!-- 4. LOGIN PAGE -->
  <div id="login-page" class="page">
    <img src="logo.png" alt="Gala Logo" class="top-logo">
    <div class="form-container">
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to access your account</p>
      
      <form onsubmit="event.preventDefault(); loginUser();">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="login-phone" placeholder="08012345678" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="submit-btn">Log In</button>
      </form>
      
      <div class="auth-switch">
        Don't have an account? <a onclick="showPage('registration-page')">Register here</a>
      </div>
    </div>
  </div>

  <!-- SUPABASE SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  
  <script>
    // 1. Splash Screen & Auto-Referral Logic
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.classList.add('splash-hidden');
        
        // Check URL for referral code (e.g., index.html?ref=GALA1234)
        const urlParams = new URLSearchParams(window.location.search);
        const refCode = urlParams.get('ref');
        
        if (refCode) {
          // If there's a referral code, take them straight to registration
          showPage('registration-page');
          
          const refInput = document.getElementById('reg-referral');
          if (refInput) {
            refInput.value = refCode;
            
            // Lock the input so the user cannot change the referral code
            refInput.readOnly = true;
            refInput.style.backgroundColor = '#e9ecef'; // Grey background
            refInput.style.cursor = 'not-allowed';
          }
        } else {
          // Otherwise, show the welcome page
          showPage('welcome-page');
        }
        
        setTimeout(() => { splash.remove(); }, 600); 
      }, 2000); 
    });

    // 2. Page Navigation Logic
    function showPage(pageId) {
      const pages = document.querySelectorAll('.page');
      pages.forEach(page => { page.classList.remove('active'); });
      
      const targetPage = document.getElementById(pageId);
      if (targetPage) {
        setTimeout(() => { targetPage.classList.add('active'); }, 50);
      }
      window.scrollTo(0, 0);
    }

    // 3. Register User in Supabase
    async function registerUser() {
      const name = document.getElementById('reg-name').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      let refBy = document.getElementById('reg-referral').value.trim();
      const myRefCode = 'GALA' + Math.floor(1000 + Math.random() * 9000);

      // Check if user already exists
      const { data: existing } = await supabaseClient.from('users').select('id').eq('phone', phone);
      if(existing && existing.length > 0) return alert("Phone number already registered!");

      // Insert new user
      const { error } = await supabaseClient.from('users').insert([{ 
        full_name: name, 
        phone: phone, 
        password: password, 
        referral_code: myRefCode, 
        referred_by: refBy || null 
      }]);

      if (error) {
        alert("Registration failed: " + error.message);
      } else {
        alert("Registration Successful! Please log in.");
        showPage('login-page');
      }
    }

    // 4. Login User via Supabase
    async function loginUser() {
      const phone = document.getElementById('login-phone').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabaseClient
        .from('users')
        .select('id')
        .eq('phone', phone)
        .eq('password', password)
        .single();

      if (error || !data) {
        alert("Invalid phone number or password.");
      } else {
        // Save user ID to local storage to keep them logged in
        localStorage.setItem('userId', data.id);
        alert("Login Successful!");
        window.location.href = "dashboard.html";
      }
    }
  </script>
</body>
</html>
