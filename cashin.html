<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gala Deposit</title>
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background-color: #F8F9FA; padding: 15px; display: flex; justify-content: center; }
  .app-container { width: 100%; max-width: 500px; background: #fff; border-radius: 16px; padding-bottom: 20px; }
  .header { display: flex; padding: 15px 20px; border-bottom: 1px solid #eee; position: relative; justify-content: center; align-items: center; }
  .back-btn { position: absolute; left: 20px; font-size: 1.5rem; color: #D50000; text-decoration: none; font-weight: bold; }
  .header-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #D50000; object-fit: cover; }
  .content { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .input-group input { width: 100%; padding: 15px; font-size: 1.4rem; font-weight: 900; text-align: center; border: 2px solid #ddd; border-radius: 12px; outline: none; }
  .input-group input:focus { border-color: #D50000; }
  .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  .amount-btn { padding: 12px 5px; border-radius: 8px; border: 2px solid #ddd; background: #fff; font-weight: 800; cursor: pointer; font-size: 14px;}
  .amount-btn.active { border-color: #D50000; color: #D50000; background: #FFF0F0; }
  .channel-container { display: flex; gap: 10px; width: 100%; }
  .channel-btn { flex: 1; border: 2px solid #ddd; border-radius: 10px; padding: 15px 5px; text-align: center; font-weight: 800; background: #fff; font-size: 14px; cursor: pointer; transition: 0.2s;}
  .channel-btn.active { border-color: #D50000; color: #D50000; background: #FFF0F0; }
  .process-btn { width: 100%; background: #D50000; color: #fff; border: none; padding: 15px; font-size: 1rem; font-weight: 900; border-radius: 12px; cursor: pointer;}
</style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <a href="dashboard.html" class="back-btn">&lt;</a>
      <img src="logo.png" class="header-logo">
    </header>
    <div class="content">
      <div class="input-group" style="width:100%;"><input type="number" id="amount" placeholder="₦ 0.00" oninput="clearActive()"></div>
      <div class="amount-grid">
        <button class="amount-btn" onclick="setAmt(4500)">4,500</button>
        <button class="amount-btn" onclick="setAmt(11000)">11,000</button>
        <button class="amount-btn" onclick="setAmt(25000)">25,000</button>
      </div>
      <div class="channel-container">
        <div class="channel-btn active" onclick="setChan('MoMo', this)">Channel 1</div>
        <div class="channel-btn" onclick="setChan('FirstBank', this)">Channel 2</div>
        <div class="channel-btn" onclick="setChan('SmartCash', this)">Channel 3</div>
      </div>
      <button class="process-btn" onclick="proceed()">Process</button>
    </div>
  </div>
  <script>
    let chan = 'MoMo'; 
    
    function setAmt(val) { 
      document.getElementById('amount').value = val; 
      document.querySelectorAll('.amount-btn').forEach(b=>b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function clearActive() {
      document.querySelectorAll('.amount-btn').forEach(b=>b.classList.remove('active'));
    }
    
    function setChan(c, btn) { 
      chan = c; 
      document.querySelectorAll('.channel-btn').forEach(b=>b.classList.remove('active')); 
      btn.classList.add('active'); 
    }
    
    function proceed() {
      let amt = document.getElementById('amount').value;
      if(!amt || amt <= 0) return alert("Please enter a valid amount");
      
      localStorage.setItem('depAmount', amt);
      localStorage.setItem('depChannel', chan);
      window.location.href = 'payment.html';
    }
  </script>
</body>
</html>
